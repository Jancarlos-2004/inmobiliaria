<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nexus Living Co">
  <defs>
    <linearGradient id="nlGrad" x1="10" y1="14" x2="90" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F4C5C"/>
      <stop offset="0.55" stop-color="#12586A"/>
      <stop offset="1" stop-color="#C8862B"/>
    </linearGradient>
    <linearGradient id="nlGradSoft" x1="10" y1="14" x2="90" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F4C5C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C8862B" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- insignia circular -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#nlGrad)" stroke-width="2.5"/>

  <!-- techo: tres trazos paralelos formando el perfil de una casa -->
  <path d="M20 50 L50 25 L80 50" fill="none" stroke="url(#nlGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 56 L50 34 L74 56" fill="none" stroke="url(#nlGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>
  <path d="M32 62 L50 43 L68 62" fill="none" stroke="url(#nlGradSoft)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- cuerpo de la casa -->
  <path d="M31 55 V78 H69 V55" fill="none" stroke="url(#nlGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- puerta -->
  <path d="M44 78 V63 C44 59.5 46.5 57 50 57 C53.5 57 56 59.5 56 63 V78" fill="url(#nlGrad)" opacity="0.92"/>
</svg>
